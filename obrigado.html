<style>
  :root {
    --azul: #2230d8;
    --azul-escuro: #161fa0;
    --branco: #ffffff;
    --gelo: #e8ecff;
    --verde: #25d366;
    --verde-escuro: #128c4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--azul);
    background-image:
      radial-gradient(circle at 90% 8%, rgba(255,255,255,.14) 0, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 5% 95%, var(--azul-escuro) 0, rgba(22,31,160,0) 45%);
    color: var(--branco);
    display: flex;
    flex-direction: column;
    min-height: 100%;

  }
  .marca {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -.02em;
  }
  .marca span { font-weight: 400; opacity: .8; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 0;
  }
  .selo {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    background: var(--branco);
    display: grid;
    place-items: center;
    margin-bottom: 32px;
    box-shadow: 0 0 0 12px rgba(255,255,255,.14), 0 0 0 28px rgba(255,255,255,.07);
    animation: pop .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  .selo svg { width: 56px; height: 56px; }
  .selo path {
    fill: none;
    stroke: var(--azul);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: tracar .5s .45s ease-out forwards;
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes tracar { to { stroke-dashoffset: 0; } }
  h1 {
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -.03em;
    margin-bottom: 16px;
  }
  p.texto {
    font-size: 1.1rem;
    line-height: 1.55;
    color: var(--gelo);
    max-width: 30ch;
    margin-bottom: 36px;
  }
  .botoes {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 24px;
    border-radius: 999px;
    font: inherit;
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: none;
    transition: transform .15s ease, background .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--branco); outline-offset: 3px; }
  .btn-zap { background: var(--verde); color: #04301a; }
  .btn-zap:hover { background: #3be07c; }
  .btn-zap svg { width: 24px; height: 24px; fill: currentColor; }
  .btn-voltar { background: transparent; color: var(--branco); border: 2px solid rgba(255,255,255,.45); }
  .btn-voltar:hover { background: rgba(255,255,255,.1); }
  footer { text-align: center; font-size: .9rem; color: var(--gelo); opacity: .8; }
  @media (prefers-reduced-motion: reduce) {
    .selo, .selo path { animation: none; stroke-dashoffset: 0; }
  }
</style>
